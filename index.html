UNITS.push(U(10, 'B1', 'Present Perfect Simple', 'Experiencias, “desde hace” y resultados', [
  Pp(`El <b>Present Perfect</b> conecta el pasado con el presente. No dice cuándo pasó algo; importa la experiencia, el resultado o cuánto tiempo dura. A veces se traduce con presente: “vivo aquí desde hace tres años” = <i>I’ve lived here for three years</i>.`),
  H('Formas'),
  FORM([['+', 'subject + have / has + past participle', `I<mark>'ve eaten</mark> breakfast. He <mark>has eaten</mark> lunch.`], ['−', 'subject + have / has + not + past participle', `We <mark>haven't eaten</mark> yet.`], ['?', '(question word +) have / has + subject + past participle?', `What <mark>have</mark> you <mark>eaten</mark> today?`]]),
  H('Cuándo se usa'),
  TBL(['Uso', 'Ejemplo', 'Palabras clave'], [['Acción que empezó en el pasado y sigue (¿cuánto tiempo?)', 'I\'ve lived here for three years.', 'for, since, how long'], ['Experiencia de vida', 'Have you ever been to Galway?', 'ever, never, once, twice'],
    ['Periodo que aún no termina', 'I haven\'t seen her this month.', 'today, this week / month / year'], ['Resultado en el presente', 'I\'ve lost my keys, so I can\'t get in.', '—'], ['Noticias recientes', 'The bus has just arrived.', 'just, already, yet, recently']]),
  H('For, since, been y gone'),
  TBL(['for + periodo', 'since + punto de partida'], [['for two years · for six months · for a week', 'since 2024 · since July · since Monday · since I arrived']]),
  EX([[`She<mark>'s lived</mark> in Cork <mark>for</mark> three years.`, 'Vive en Cork desde hace tres años.'], [`I<mark>'ve known</mark> him <mark>since</mark> 2019.`, 'Lo conozco desde 2019.'], [`She<mark>'s been</mark> to Dublin.`, 'Ha estado en Dublín (y ya volvió).'], [`She<mark>'s gone</mark> to Dublin.`, 'Se ha ido a Dublín (sigue allí).']]),
  H('Yet, already y just'),
  UL([`<b>yet:</b> en negativas y preguntas, al final. <i>I haven’t finished yet. Have you finished yet?</i>`, `<b>already:</b> en afirmativas, para algo que ocurrió antes de lo esperado. <i>I’ve already paid.</i>`, `<b>just:</b> hace un momento. <i>The bus has just left.</i>`]),
  TIP('Atención', `No se usa con marcas de tiempo terminadas: <i>I have seen him yesterday</i> es incorrecto. Se dice <i>I saw him yesterday</i> (past simple).`),
  TIP('', `En Irlanda oirás mucho <b>I’m after + -ing</b>: <i>I’m after eating</i> = <i>I’ve just eaten</i>. Es hiberno-inglés. Entiéndelo, pero en tus frases usa <i>I’ve just eaten</i>.`, true),
  H('Errores típicos'),
  ERR([['I live here since 2020.', 'I\'ve lived here since 2020.', 'Con since / for desde el pasado hasta hoy se usa present perfect.'], ['I have been in Cork yesterday.', 'I was in Cork yesterday.', 'Yesterday pide past simple.'], ['Did you ever be in Galway?', 'Have you ever been to Galway?', 'Las experiencias de vida usan present perfect.'], ['It\'s the first time I come here.', 'It\'s the first time I\'ve been here.', 'Después de “the first time” va present perfect.']])
], [
  mc('I ___ here since September.', ['have lived', 'live', 'am living', 'lived'], 0, 'Desde un punto del pasado hasta ahora: present perfect con since.'),
  mc('Have you ___ been to Dublin?', ['ever', 'yet', 'since', 'for'], 0, 'Para experiencias de vida: ever / never.'),
  fill('She ___ (live) in Cork for two years.', ['has lived', '\'s lived'], 'For + periodo: present perfect.'),
  mc('I ___ him yesterday.', ['saw', 'have seen', 'see', 'was seeing'], 0, 'Con yesterday se usa past simple.'),
  mc('John isn\'t here. He ___ to the shops.', ['has gone', 'has been', 'is gone to', 'went'], 0, 'Gone = ha ido y sigue allí.'),
  fill('We ___ (not / finish) yet.', ['haven\'t finished', 'have not finished'], 'Con yet en negativas: present perfect.'),
  ord('Have you ever eaten a full Irish breakfast', 'Have + sujeto + ever + participio.')
]));

UNITS.push(U(11, 'B1', 'Present Perfect Continuous', 'Duración y resultados visibles', [
  Pp(`El <b>Present Perfect Continuous</b> pone el foco en la <b>acción</b> y su duración, no solo en el resultado. Es muy natural para explicar “llevo + gerundio”: <i>llevo estudiando inglés seis meses</i>.`),
  H('Formas'),
  FORM([['+', 'subject + have / has + been + verb-ing', `I<mark>'ve been eating</mark>. She<mark>'s been eating</mark> biscuits all day.`], ['−', 'subject + have / has + not + been + verb-ing', `They <mark>haven't been eating</mark>.`], ['?', '(question word +) have / has + subject + been + verb-ing?', `What <mark>has</mark> she <mark>been eating</mark>?`]]),
  H('Cuándo se usa'),
  UL([`<b>Cuánto tiempo dura algo que sigue ahora</b> (for / since): <i>I’ve been learning English for six months.</i>`, `<b>Situaciones o hábitos temporales recientes</b> (recently): <i>I’ve been going to the gym a lot recently.</i>`, `<b>Acción que acaba de parar y tiene un resultado visible:</b> <i>I’m tired. I’ve been studying.</i> / <i>The roads are wet. It’s been raining.</i>`]),
  TBL(['Present Perfect Simple', 'Present Perfect Continuous'], [['Foco en el resultado: I\'ve written three emails.', 'Foco en la actividad: I\'ve been writing emails all morning.'], ['Cuántas veces o cuánto: She\'s read ten books.', 'Cuánto tiempo: She\'s been reading for two hours.'],
    ['Con verbos de estado: I\'ve known her for years.', 'No con verbos de estado: ✗ I\'ve been knowing her.']]),
  CHIPS('Marcadores de tiempo', ['for', 'since', 'how long', 'all day', 'all week', 'recently', 'lately']),
  EX([[`How long <mark>have</mark> you <mark>been waiting</mark>?`, '¿Cuánto llevas esperando?'], [`I<mark>'ve been living</mark> in Cork since August.`, 'Vivo en Cork desde agosto.'], [`She<mark>'s been working</mark> here since 2019.`, 'Trabaja aquí desde 2019.'], [`It<mark>'s been raining</mark> all week.`, 'Ha estado lloviendo toda la semana.']]),
  H('Errores típicos'),
  ERR([['I\'m learning English since January.', 'I\'ve been learning English since January.', 'Con since / for hasta ahora, perfect continuous.'], ['I\'ve been knowing her for years.', 'I\'ve known her for years.', '<i>Know</i> es un verbo de estado.'], ['She is working here for two years.', 'She has been working here for two years.', 'For + periodo desde el pasado: perfect.'], ['How long you have been waiting?', 'How long have you been waiting?', 'Orden de pregunta: have + sujeto.']])
], [
  mc('She ___ for the bus for twenty minutes.', ['has been waiting', 'is waiting', 'waits', 'waited'], 0, 'Duración hasta ahora: present perfect continuous.'),
  fill('I ___ (learn) English since January.', ['have been learning'], 'Since + hasta ahora: have been + -ing.'),
  mc('How long ___ here?', ['have you been living', 'are you living', 'do you live', 'did you lived'], 0, 'How long + have + sujeto + been + -ing.'),
  mc('I\'m tired because I ___ all day.', ['\'ve been working', 'work', 'am working', 'was worked'], 0, 'Resultado visible de una actividad reciente.'),
  mc('I ___ her for ten years. (know)', ['have known', 'have been knowing', 'know', 'am knowing'], 0, 'Know es un verbo de estado: present perfect simple.'),
  ord('How long have you been studying English', 'How long + have + sujeto + been + -ing.'),
  fill('It ___ (rain) all morning. The roads are wet.', ['has been raining', '\'s been raining'], 'Actividad reciente con resultado visible.')
]));

UNITS.push(U(12, 'B1', 'Past Perfect', 'Lo que había pasado antes de otro momento del pasado', [
  Pp(`El <b>Past Perfect</b> marca la acción más antigua cuando hay dos acciones en el pasado. Es el “había + participio” español. La versión continua pone el foco en la duración.`),
  H('Formas'),
  FORM([['+', 'subject + had + past participle', `I<mark>'d eaten</mark> before I left.`], ['−', 'subject + had + not + past participle', `We <mark>hadn't eaten</mark>.`], ['?', '(question word +) had + subject + past participle?', `Why <mark>had</mark> you <mark>eaten</mark>?`], ['cont.', 'subject + had + been + verb-ing', `She<mark>'d been waiting</mark> for an hour.`]]),
  TBL(['Orden de los hechos', 'Frase'], [['1.º llegó el tren — 2.º llegué yo', 'When I arrived, the train had left.'], ['1.º estudió toda la noche — 2.º hizo el examen', 'She was tired because she had been studying all night.'], ['1.º compró billete — 2.º salió el tren', 'He had already bought a ticket when the train left.']]),
  CHIPS('Marcadores de tiempo', ['already', 'just', 'before', 'by the time', 'when', 'after', 'never … before', 'for … when']),
  EX([[`When we arrived, the film <mark>had</mark> already <mark>started</mark>.`, 'Cuando llegamos, la película ya había empezado.'], [`She <mark>had never been</mark> to Ireland before last year.`, 'Nunca había estado en Irlanda antes del año pasado.'], [`I was tired because I <mark>had been working</mark> all night.`, 'Estaba cansado porque llevaba toda la noche trabajando.'], [`They <mark>had been waiting</mark> for two hours when the bus came.`, 'Llevaban dos horas esperando cuando llegó el autobús.']]),
  TIP('', `Si el orden ya está claro con <i>before</i> o <i>after</i>, puedes usar past simple en ambas: <i>After I finished, I went home.</i> Pero con <i>when</i> y <i>by the time</i>, el past perfect evita confusiones.`),
  H('Errores típicos'),
  ERR([['When we arrived, the film already started.', 'When we arrived, the film had already started.', 'La acción anterior va en past perfect.'], ['I had went home.', 'I had gone home.', 'Had + participio, no pasado simple.'], ['She had been knowing him.', 'She had known him.', 'Los verbos de estado no van en continuo.']])
], [
  mc('When I got to the station, the train ___.', ['had left', 'has left', 'leaves', 'was leaving'], 0, 'El tren se fue antes: past perfect.'),
  fill('She ___ (not / eat) before the party, so she was starving.', ['hadn\'t eaten', 'had not eaten'], 'Negativo: hadn\'t + participio.'),
  mc('I was tired because I ___ all night.', ['had been studying', 'am studying', 'study', 'will study'], 0, 'Actividad larga anterior a un momento del pasado.'),
  fill('By the time we arrived, the film ___ (already / start).', ['had already started'], 'Past perfect con already.'),
  ord('She had never been to Ireland before last year', 'Had + never + participio.'),
  mc('I ___ that film before, so I didn\'t watch it again.', ['had seen', 'have seen', 'was seeing', 'see'], 0, 'Experiencia anterior a otro momento del pasado.'),
  mc('They ___ for two hours when the bus finally came.', ['had been waiting', 'were waited', 'have waited', 'waiting'], 0, 'Duración anterior a otro momento del pasado.')
]));

UNITS.push(U(13, 'B1', 'Modal verbs 2', 'Obligación, prohibición, probabilidad y deducción', [
  Pp(`Los modales también expresan lo que es necesario, lo que está prohibido y qué tan seguros estamos de algo. Hay una diferencia clave: <b>mustn’t</b> (prohibido) no es lo mismo que <b>don’t have to</b> (no es necesario).`),
  H('Obligación y prohibición'),
  TBL(['Idea', 'Forma', 'Ejemplo'], [['Obligación fuerte (de quien habla)', 'must', 'I must call my landlord today.'], ['Obligación externa (reglas)', 'have to / has to', 'You have to tap your Leap Card when you get on the bus.'], ['Prohibido', 'mustn\'t / can\'t', 'You mustn\'t park on double yellow lines.'],
    ['No es necesario', 'don\'t have to / needn\'t', 'You don\'t have to tip, but many people leave about 10%.'], ['Pasado de must / have to', 'had to', 'I had to show my passport.'], ['Futuro', 'will have to', 'You\'ll have to register first.']]),
  H('Probabilidad y deducción'),
  TBL(['Seguridad', 'Forma', 'Ejemplo'], [['Casi seguro (sí)', 'must + verbo', 'She must be tired. She\'s been working all day.'], ['Casi seguro (no)', 'can\'t + verbo', 'He can\'t be at work. It\'s Sunday.'], ['Posible', 'might / may / could + verbo', 'It might rain later. She could be at the library.']]),
  EX([[`You <mark>mustn't</mark> use your phone in the exam.`, 'No debes usar el móvil en el examen.'], [`You <mark>don't have to</mark> book. Just turn up.`, 'No hace falta reservar. Preséntate.'], [`He <mark>must</mark> be tired. He's been running.`, 'Debe de estar cansado. Ha estado corriendo.'], [`That <mark>can't</mark> be right. It's too cheap.`, 'Eso no puede ser. Es demasiado barato.'], [`It <mark>might</mark> snow tonight.`, 'Puede que nieve esta noche.']]),
  TIP('', `En Irlanda, para el autobús y la Luas se usa una <b>Leap Card</b>: <i>You have to tap on when you get on.</i> En pubs y espacios cerrados no se puede fumar: <i>You can’t smoke inside.</i>`, true),
  H('Errores típicos'),
  ERR([['You mustn\'t to go.', 'You mustn\'t go.', 'Modal + verbo base, sin to.'], ['I must to leave.', 'I must leave. / I have to leave.', 'Después de must no va to.'], ['She has to goes.', 'She has to go.', 'Después de to va el verbo base.'], ['You don\'t must pay.', 'You don\'t have to pay.', 'Must no se usa con don\'t.']])
], [
  mc('You ___ park here. It\'s forbidden.', ['mustn\'t', 'don\'t have to', 'needn\'t', 'might not'], 0, 'Mustn\'t expresa prohibición.'),
  mc('You ___ pay now. You can pay later.', ['don\'t have to', 'mustn\'t', 'can\'t', 'shouldn\'t'], 0, 'Don\'t have to = no es necesario.'),
  fill('She\'s been working all day. She ___ be exhausted.', ['must'], 'Deducción casi segura: must be.'),
  mc('He ___ be at home. His car isn\'t outside.', ['can\'t', 'must', 'has to', 'should to'], 0, 'Casi seguro que no: can\'t be.'),
  mc('I ___ go to the dentist yesterday. It was an emergency.', ['had to', 'must', 'have to', 'should'], 0, 'Pasado de must / have to: had to.'),
  mc('It\'s very cloudy. It ___ rain later.', ['might', 'must to', 'is might', 'mights'], 0, 'Posibilidad: might + verbo base.'),
  ord('You have to tap your card when you get on the bus', 'Obligación externa: have to.')
]));

UNITS.push(U(14, 'B1', 'Conditionals 0, 1 and 2', 'Si pasa esto, pasa aquello; si yo fuera…', [
  Pp(`Una frase condicional tiene una condición (<i>if…</i>) y un resultado. Según lo probable que sea, se usa una estructura distinta.`),
  TBL(['Tipo', 'Estructura', 'Ejemplo'], [['0 · Hechos generales', 'If + present simple, present simple', 'If you heat ice, it melts.'], ['1 · Posible en el futuro', 'If + present simple, will + verbo', 'If it rains, we\'ll stay at home.'], ['2 · Improbable o imaginario', 'If + past simple, would + verbo', 'If I had more time, I would learn Irish.']]),
  H('Detalles útiles'),
  UL([`<b>If I were you…</b> En el segundo condicional se usa <i>were</i> con todos los sujetos (en lenguaje informal también <i>was</i>).`, `<b>unless</b> = if … not: <i>Unless you hurry, you’ll miss the bus.</i>`, `<b>Ni will ni would después de if:</b> <i>If it rains</i>, no “if it will rain”.`, `<b>Se puede invertir el orden:</b> <i>We’ll stay at home if it rains.</i> (sin coma)`]),
  H('Wish + pasado'),
  Pp(`Para lamentar algo del presente se usa <b>wish + past simple</b>: <i>I wish I spoke English better.</i> (pero no lo hablo tan bien).`),
  EX([[`If you <mark>heat</mark> water to 100°C, it <mark>boils</mark>.`, 'Si calientas agua a 100 °C, hierve.'], [`If it <mark>rains</mark>, we<mark>'ll take</mark> the bus.`, 'Si llueve, cogeremos el autobús.'], [`If I <mark>won</mark> the lottery, I <mark>would buy</mark> a house.`, 'Si me tocara la lotería, compraría una casa.'], [`If I <mark>were</mark> you, I <mark>would book</mark> now.`, 'Yo en tu lugar, reservaría ya.'], [`I <mark>wish</mark> I <mark>spoke</mark> better English.`, 'Ojalá hablara mejor inglés.']]),
  H('Errores típicos'),
  ERR([['If I will see him, I will tell him.', 'If I see him, I\'ll tell him.', 'Tras if va presente simple.'], ['If I would have money, I would travel.', 'If I had money, I would travel.', 'Tras if va past simple, no would.'], ['If I was you…', 'If I were you…', 'En registro cuidado se usa were.'], ['Unless you don\'t hurry…', 'Unless you hurry…', 'Unless ya es negativo.']])
], [
  mc('If it ___ tomorrow, we\'ll stay at home.', ['rains', 'will rain', 'rained', 'is raining'], 0, 'Primer condicional: if + presente simple.'),
  mc('If I ___ you, I\'d take the job.', ['were', 'am', 'will be', 'would be'], 0, 'Segundo condicional: if I were you.'),
  fill('If I ___ (win) the lottery, I would buy a house.', ['won'], 'Segundo condicional: if + past simple.'),
  mc('If you heat ice, it ___.', ['melts', 'will to melt', 'melted', 'is melt'], 0, 'Hecho general: presente en ambas partes.'),
  mc('She\'ll miss the bus ___ she hurries.', ['unless', 'if not', 'when', 'while'], 0, 'Unless = a menos que.'),
  ord('If I had more time I would learn Irish', 'Segundo condicional: if + past simple, would + verbo.'),
  fill('I wish I ___ (speak) English better.', ['spoke'], 'Wish + past simple para el presente.')
]));

UNITS.push(U(15, 'B1', 'The passive voice', 'Cuando importa la acción más que quién la hace', [
  Pp(`En la <b>voz pasiva</b> el sujeto recibe la acción. Se usa cuando no importa quién la hace, no se sabe o es obvio: <i>English is spoken here.</i> Se forma con <b>to be + participio</b>.`),
  TBL(['Tiempo', 'Activa', 'Pasiva'], [['Present simple', 'People speak English here.', 'English is spoken here.'], ['Present continuous', 'They are painting the house.', 'The house is being painted.'], ['Past simple', 'They built the bridge in 1950.', 'The bridge was built in 1950.'],
    ['Present perfect', 'Someone has stolen my bike.', 'My bike has been stolen.'], ['Will', 'They will announce the results.', 'The results will be announced.'], ['Modal', 'You can pay online.', 'It can be paid online.']]),
  FORM([['+', 'subject + be (en el tiempo) + past participle', `The meeting <mark>was cancelled</mark>.`], ['by', 'Para decir quién: by + agente', `The book <mark>was written by</mark> an Irish author.`]]),
  EX([[`Guinness <mark>is made</mark> in Dublin.`, 'La Guinness se hace en Dublín.'], [`The meeting <mark>was cancelled</mark>.`, 'La reunión fue cancelada.'], [`My passport <mark>has been stolen</mark>!`, '¡Me han robado el pasaporte!'], [`The house <mark>is being painted</mark>.`, 'Están pintando la casa.'], [`The results <mark>will be announced</mark> on Friday.`, 'Los resultados se anunciarán el viernes.']]),
  TIP('', `En español se usa mucho la pasiva refleja (“se habla inglés”). En inglés eso es <b>pasiva con be + participio</b>: <i>English is spoken</i>. Para “nací en…” se dice <i>I was born in…</i>.`),
  H('Errores típicos'),
  ERR([['The report was wrote yesterday.', 'The report was written yesterday.', 'Usa el participio: written.'], ['It is make in Ireland.', 'It is made in Ireland.', 'Después de be va participio.'], ['I am born in 1994.', 'I was born in 1994.', 'Born va siempre en pasado.'], ['The house is painting now.', 'The house is being painted now.', 'Presente continuo pasivo: is being + participio.']])
], [
  mc('This bridge ___ in 1950.', ['was built', 'built', 'is built', 'has built'], 0, 'Pasiva en pasado: was + participio.'),
  fill('English ___ (speak) all over Ireland.', ['is spoken'], 'Pasiva en presente: is + participio.'),
  mc('My bike ___. I can\'t find it anywhere.', ['has been stolen', 'was stealing', 'is stolen', 'has stolen'], 0, 'Present perfect pasivo: has been + participio.'),
  fill('The room ___ (clean) at the moment.', ['is being cleaned'], 'Presente continuo pasivo: is being + participio.'),
  mc('The results ___ next week.', ['will be announced', 'will announce', 'are announcing', 'announced'], 0, 'Futuro pasivo: will be + participio.'),
  ord('The letter was sent last Monday', 'Pasiva en pasado: was + participio.'),
  mc('Active → passive: “They built this house in 1900.”', ['This house was built in 1900.', 'This house is built in 1900.', 'This house built in 1900.', 'This house has been built in 1900.'], 0, 'Past simple pasivo: was built.')
]));

UNITS.push(U(16, 'B1', 'Reported speech', 'Contar lo que alguien dijo', [
  Pp(`En el <b>estilo indirecto</b> cuentas lo que alguien dijo sin repetir sus palabras exactas. Los tiempos verbales suelen retroceder un paso.`),
  TBL(['Frase original', 'Frase indirecta'], [['Present simple: “I am tired.”', 'Past simple: She said she was tired.'], ['Present continuous: “I’m working.”', 'Past continuous: He said he was working.'], ['Present perfect: “I’ve finished.”', 'Past perfect: He said he had finished.'],
    ['Past simple: “I went home.”', 'Past perfect: She said she had gone home.'], ['will: “I will call you.”', 'would: He said he would call me.'], ['can: “I can help.”', 'could: She said she could help.']]),
  TBL(['Palabra directa', 'Palabra indirecta'], [['now / today', 'then / that day'], ['tomorrow', 'the next day'], ['yesterday', 'the day before'], ['here', 'there'], ['this', 'that']]),
  H('Say, tell, ask'),
  UL([`<b>say</b> no lleva persona: <i>He said he was late.</i>`, `<b>tell</b> lleva persona: <i>He told me he was late.</i>`, `<b>Órdenes y peticiones:</b> tell / ask + persona + to + verbo. <i>She told me to wait.</i> <i>He asked me not to be late.</i>`, `<b>Preguntas:</b> ask + if / whether (sí/no) o + palabra interrogativa, <b>sin inversión</b>. <i>She asked me where I lived.</i>`]),
  EX([[`He <mark>said</mark> (that) he <mark>was</mark> tired.`, 'Dijo que estaba cansado.'], [`She <mark>told me</mark> she <mark>would call</mark>.`, 'Me dijo que llamaría.'], [`They <mark>asked me where I lived</mark>.`, 'Me preguntaron dónde vivía.'], [`He <mark>asked me if</mark> I <mark>wanted</mark> a coffee.`, 'Me preguntó si quería un café.'], [`The doctor <mark>told me not to</mark> eat spicy food.`, 'El médico me dijo que no comiera picante.']]),
  H('Errores típicos'),
  ERR([['He said me that he was late.', 'He told me that he was late.', 'Say no lleva persona; tell sí.'], ['She asked me where did I live.', 'She asked me where I lived.', 'En indirecto no hay inversión.'], ['He told that he was tired.', 'He said that he was tired.', 'Tell necesita persona.'], ['She asked me to not be late.', 'She asked me not to be late.', 'Forma negativa: not to + verbo.']])
], [
  mc('She said, “I am tired.” → She said she ___ tired.', ['was', 'is', 'were', 'has been'], 0, 'Present simple → past simple.'),
  mc('He ___ me he was late.', ['told', 'said', 'spoke', 'asked'], 0, 'Tell lleva persona.'),
  mc('“Where do you live?” → She asked me where I ___.', ['lived', 'live', 'do live', 'did live'], 0, 'Pregunta indirecta: sin do y con retroceso.'),
  fill('“I will call you.” → He said he ___ call me.', ['would'], 'Will → would.'),
  mc('“Don\'t be late.” → She told me ___ late.', ['not to be', 'don\'t be', 'to not being', 'no be'], 0, 'Orden negativa: not to + verbo.'),
  ord('He asked me if I wanted a coffee', 'Pregunta de sí/no: asked + if + sujeto + verbo.'),
  mc('“I\'ve finished.” → He said he ___ finished.', ['had', 'has', 'have', 'was'], 0, 'Present perfect → past perfect.')
]));

UNITS.push(U(17, 'B1', 'Questions', 'Preguntas directas, de sujeto, tags e indirectas', [
  Pp(`Formar preguntas bien es esencial: en inglés casi todas necesitan un <b>auxiliar</b> (do, does, did, be, have, will) delante del sujeto.`),
  TBL(['Palabra', 'Pregunta por', 'Ejemplo'], [['who', 'personas', 'Who is your landlord?'], ['what', 'cosas, acciones', 'What do you do?'], ['where', 'lugar', 'Where do you live?'], ['when / what time', 'tiempo', 'What time does it open?'], ['why', 'motivo', 'Why are you learning English?'],
    ['how', 'manera', 'How do you get to work?'], ['how much / how many', 'cantidad', 'How much is the rent? How many rooms?'], ['how long', 'duración', 'How long have you lived here?'], ['which', 'elección limitada', 'Which bus goes to the airport?'], ['whose', 'posesión', 'Whose bag is this?']]),
  FORM([['?', 'question word + auxiliary + subject + verb?', `Where <mark>do</mark> you <mark>work</mark>?`], ['sujeto', 'Pregunta por el sujeto: sin auxiliar', `Who <mark>called</mark> you? (no “who did call”)`], ['prep.', 'La preposición va al final', `Who are you <mark>talking to</mark>?`]]),

const patchUnit = (id, blocks, extraEx) => {
  const u = UNITS.find(x => x.id === id);
  if (!u) return;
  let i = u.blocks.findIndex(b => b.t === 'h' && b.h === 'Errores típicos');
  if (i < 0) i = u.blocks.length;
  u.blocks.splice(i, 0, ...blocks);
  (extraEx || []).forEach(e => u.ex.push(e));
};

const braceHtml = s => s.replace(/\{([^}]+)\}/g, '<mark>$1</mark>');
const braceBlank = s => s.replace(/\{([^}]+)\}/g, '___');

function particleQuiz(list, n) {

}

function setProgress(s) { const v = P.vocab[s.id] || {}; return s.items.filter(i => v[i[0]]).length; }
function renderVocab(arg) {
  const s = VOCAB.find(x => x.id === arg);

  view().innerHTML = `<div class="stack"><div class="stack-s"><h1>Vocabulario</h1><p class="muted" style="max-width:64ch">Doce sets temáticos para la vida en Irlanda. Cada uno tiene tarjetas, lista con audio y un quiz. Marca las palabras que ya sabes y verás tu avance.</p></div>
  <div class="grid">${VOCAB.map(v => { const k = setProgress(v); return `<a class="tile" href="#vocab-${v.id}"><h3>${v.title}</h3><p>${v.sub}</p><div class="bar" aria-hidden="true"><i style="width:${Math.round(k / v.items.length * 100)}%"></i></div><span class="small muted">${k} de ${v.items.length} palabras sabidas</span></a>`; }).join('')}</div></div>`;
}
let VTAB = 'cards';
function renderVocabSet(s) {
  const draw = () => {
    const h = view();
    const k = setProgress(s);
    h.innerHTML = `<div class="stack"><div class="uhead"><div class="crumbs"><a href="#vocabulario">Vocabulario</a> / ${s.title}</div><h1>${s.title}</h1><p class="muted">${s.sub}</p>
      <div class="row"><div class="seg" id="vt"><button type="button" data-t="cards" aria-pressed="${VTAB === 'cards'}">Tarjetas</button><button type="button" data-t="list" aria-pressed="${VTAB === 'list'}">Lista</button><button type="button" data-t="quiz" aria-pressed="${VTAB === 'quiz'}">Quiz</button></div><span class="small muted">${k} de ${s.items.length} sabidas</span></div></div>
      <div id="vb"></div></div>`;
    $('#vt').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; VTAB = b.dataset.t; draw(); });
    const vb = $('#vb');
    if (VTAB === 'list') {
      vb.innerHTML = `<div class="tblw"><table><thead><tr><th>English</th><th>Español</th><th>Ejemplo</th></tr></thead><tbody>${s.items.map(i => `<tr><td><b>${i[0]}</b> ${sayBtn(i[0])}</td><td>${i[1]}</td><td class="muted">${i[2]} ${sayBtn(i[2])}</td></tr>`).join('')}</tbody></table></div>`;
    } else if (VTAB === 'quiz') {
      const make = () => pick(s.items, Math.min(10, s.items.length)).map(i => {
        const others = pick(s.items.filter(x => x !== i), 3).map(x => x[0]);
        return mc(`¿Cómo se dice <b>${i[1]}</b> en inglés?`, [i[0]].concat(others), 0, `${i[0]}: ${i[2]}`);
      });
      runQuiz(vb, make(), { title: s.title, reshuffle: make });
    } else {
      cards(vb);
    }
  };
  const cards = vb => {
    const v = P.vocab[s.id] = P.vocab[s.id] || {};
    let queue = s.items.filter(i => !v[i[0]]);
    if (!queue.length) { vb.innerHTML = `<div class="qcard result" style="max-width:560px"><div class="big">¡Set completo!</div><p>Marcaste todas las palabras como sabidas. Repásalas en la pestaña Quiz o reinicia el set.</p><div class="row"><button class="btn" id="rs" type="button">Reiniciar set</button></div></div>`; $('#rs').addEventListener('click', () => { P.vocab[s.id] = {}; save(); draw(); }); return; }
    queue = shuffle(queue);
    let flipped = false;
    const show = () => {
      const it = queue[0];
      vb.innerHTML = `<div class="stack-s" style="align-items:flex-start;max-width:560px"><div class="small muted">Quedan ${queue.length} por aprender</div>
        <button class="fc" id="fc" type="button" aria-label="Girar tarjeta">${flipped ? `<span class="w">${esc(it[1])}</span><span class="eg"><b>${esc(it[0])}</b><br>${esc(it[2])}</span>` : `<span class="w">${esc(it[0])}</span><span class="hint">Toca para ver el significado</span>`}</button>
        <div class="row">${CAN_SAY ? `<button class="btn sm" id="sy" type="button">Escuchar</button>` : ''}${flipped ? `<button class="btn" id="again" type="button">Repasar otra vez</button><button class="btn primary" id="know" type="button">La sé</button>` : ''}</div></div>`;
      $('#fc').addEventListener('click', () => { flipped = !flipped; show(); });
      if ($('#sy')) $('#sy').addEventListener('click', () => say(it[0] + '. ' + it[2]));
      if (flipped) {
        $('#know').addEventListener('click', () => { v[it[0]] = 1; save(); queue.shift(); flipped = false; if (queue.length) show(); else draw(); });
        $('#again').addEventListener('click', () => { queue.push(queue.shift()); flipped = false; show(); });
      }
    };
    show();
  };
  draw();
}

function renderTest() {
  view().innerHTML = `<div class="stack"><div class="stack-s"><h1>Test de nivel</h1><p class="muted" style="max-width:62ch">21 preguntas de dificultad creciente. Responde sin buscar ayuda: el resultado sirve para ordenar tu estudio. Dura unos 10 minutos.</p></div><div id="tq"><div class="cta-end"><div><b>Empezar el test</b><div class="small muted">7 preguntas A2, 7 preguntas B1 y 7 preguntas B2.</div></div><button class="btn primary" id="tgo" type="button">Empezar</button></div></div></div>`;
  $('#tgo').addEventListener('click', () => {
    const items = LEVELTEST.map((x, i) => Object.assign({}, x, { id: undefined }));
    runQuiz($('#tq'), items, {
      title: 'Test de nivel', onDone: r => {
        const miss = { A2: 0, B1: 0, B2: 0 };
        r.missed.forEach(m => { miss[m.lv]++; });
        const ok = l => 7 - miss[l] >= 5;
        let level, start, msg;
        if (!ok('A2')) { level = 'A1–A2'; start = 1; msg = 'Empieza desde la Unidad 1 y avanza en orden. Las bases van a darte mucho rendimiento.'; }
        else if (!ok('B1')) { level = 'A2'; start = 10; msg = 'Dominas lo básico. Repasa rápido las unidades A2 con sus ejercicios y empieza en serio por la Unidad 10 (Present Perfect).'; }
        else if (!ok('B2')) { level = 'B1'; start = 18; msg = 'Tienes una base B1 sólida. Haz los ejercicios de las unidades B1 que te fallen y sigue con la Unidad 18.'; }
        else { level = 'B2'; start = 18; msg = 'Muy buen nivel. Usa Práctica para el repaso mixto y las unidades B2 para pulir detalles.'; }
        P.test = { level, score: r.right, total: r.total, at: Date.now() }; save();
        const card = $('.result', r.host);
        $('.big', card).insertAdjacentHTML('afterend', `<div class="stack-s"><h3>Nivel estimado: ${level}</h3><p>${msg}</p><p class="small muted">A2: ${7 - miss.A2}/7 · B1: ${7 - miss.B1}/7 · B2: ${7 - miss.B2}/7</p></div>`);
        $('#after', r.host).insertAdjacentHTML('beforeend', `<a class="btn" href="#unidad-${start}">Ir a la Unidad ${start}</a><a class="btn" href="#plan">Ver el plan</a>`);
      }
    });
  });
}

function weekNow() {
  if (!P.start) return 0;
  const d = Math.floor((Date.now() - new Date(P.start + 'T00:00:00').getTime()) / 604800000) + 1;
  return d >= 1 && d <= 25 ? d : 0;
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'inicio';
  const i = h.indexOf('-');
  const name = i < 0 ? h : h.slice(0, i), arg = i < 0 ? '' : h.slice(i + 1);
  setNav(name);
  switch (name) {
    case 'inicio': renderHome(); break;
    case 'gramatica': renderGrammar(); break;
    case 'unidad': renderUnit(arg); break;
    case 'conjugador': renderConj(); break;
    case 'listas': renderLists(arg); break;
    case 'modales': renderModals(); break;
    case 'vocabulario': renderVocab(''); break;
    case 'vocab': renderVocab(arg); break;
    case 'irlanda': renderIreland(arg); break;
    case 'practica': renderPractice(); break;
    case 'lectura': renderReading(arg); break;
    case 'test': renderTest(); break;
    case 'plan': renderPlan(); break;
    default: renderHome();
  }
  window.scrollTo(0, 0);
}

});
if (CAN_SAY) {
  document.addEventListener('click', e => {
    const b = e.target.closest('#vbtn'); if (!b) return;
    const p = $('#vpanel'), open = p.hidden;
    closePanels();
    if (open) { p.hidden = false; b.setAttribute('aria-expanded', 'true'); drawVoicePanel(); }
  });
  try { speechSynthesis.addEventListener('voiceschanged', () => { const p = $('#vpanel'); if (p && !p.hidden) drawVoicePanel(); }); } catch (e) { /* ignore */ }
}
shell();
window.addEventListener('hashchange', route);
route();
</script>

</body>
