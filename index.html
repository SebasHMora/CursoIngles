<style>
[hidden] { display: none !important; }
/* Layout concept: Irish wayfinding. Green sign plates say where you are, the Irish line sits above the English one, and everything else stays quiet fog-grey. */
:root {
  --bg: #edf0ea;
  --surface: #f7f9f5;
  --surface-2: #e2e8e0;
  --fg: #18231e;
  --muted: #56645c;
  --line: #c6d0c5;
  --sign: #0c5640;
  --sign-ink: #f3f9f5;
  --link: #1d5b7c;
  --hi: #f0c53c;
  --hi-soft: #f6e7a8;
  --ok: #1b7a47;
  --ok-bg: #d9eee0;
  --bad: #ad3f2e;
  --bad-bg: #f5dcd5;
  --lv-a2: #2a6a8f;
  --lv-b1: #0c5640;
  --lv-b2: #8a5612;
  --c-past: #dbe7ee;
  --c-pres: #d9eee0;
  --c-fut: #f6e7a8;
  --c-past-b: #2a6a8f;
  --c-pres-b: #1b7a47;
  --c-fut-b: #b98a1a;
  --font-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1512;
    --surface: #151f1a;
    --surface-2: #1e2a24;
    --fg: #e5ece7;
    --muted: #9baba1;
    --line: #2c3b33;
    --sign: #11704f;
    --sign-ink: #f3f9f5;
    --link: #86bfdf;
    --hi: #e8bf3a;
    --hi-soft: #4b4012;
    --ok: #5cc58a;
    --ok-bg: #173421;
    --bad: #f0907c;
    --bad-bg: #3b1e19;
    --lv-a2: #86bfdf;
    --lv-b1: #5cc58a;
    --lv-b2: #e0a85a;
    --c-past: #1c2d38;
    --c-pres: #173421;
    --c-fut: #3d3511;
    --c-past-b: #86bfdf;
    --c-pres-b: #5cc58a;
    --c-fut-b: #e0b03e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1512;
  --surface: #151f1a;
  --surface-2: #1e2a24;
  --fg: #e5ece7;
  --muted: #9baba1;
  --line: #2c3b33;
  --sign: #11704f;
  --sign-ink: #f3f9f5;
  --link: #86bfdf;
  --hi: #e8bf3a;
  --hi-soft: #4b4012;
  --ok: #5cc58a;
  --ok-bg: #173421;
  --bad: #f0907c;
  --bad-bg: #3b1e19;
  --lv-a2: #86bfdf;
  --lv-b1: #5cc58a;
  --lv-b2: #e0a85a;
  --c-past: #1c2d38;
  --c-pres: #173421;
  --c-fut: #3d3511;
  --c-past-b: #86bfdf;
  --c-pres-b: #5cc58a;
  --c-fut-b: #e0b03e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--surface);
}
a { color: var(--link); text-underline-offset: 3px; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 5vw, 3.1rem); font-weight: 800; }
h2 { font-size: 1.55rem; font-weight: 700; }
h3 { font-size: 1.2rem; font-weight: 700; }
h4 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
mark { background: var(--hi-soft); color: inherit; padding: 0 .18em; border-radius: 3px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; left: -9999px; }

.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* header */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 18px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); flex: none; }
.brand .plate { padding: 3px 9px 4px; font-size: .78rem; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; letter-spacing: -.01em; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  flex: none; text-decoration: none; color: var(--muted); font-weight: 600; font-size: .92rem;
  padding: 8px 11px; border-radius: 6px; white-space: nowrap;
}
.nav a:hover { color: var(--fg); background: var(--surface-2); }
.nav a[aria-current="page"] { color: var(--sign-ink); background: var(--sign); }
@media (max-width: 560px) { .brand b { display: none; } }

main { padding-block: 28px 64px; }
.stack { display: flex; flex-direction: column; gap: 28px; }
.stack-s { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.lbl { font-size: .72rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* sign plate: the recurring motif */
.plate {
  display: inline-flex; flex-direction: column; align-items: flex-start; line-height: 1.1;
  background: var(--sign); color: var(--sign-ink); border-radius: 7px;
  box-shadow: inset 0 0 0 2px var(--sign), inset 0 0 0 3.5px color-mix(in srgb, var(--sign-ink) 88%, transparent);
  padding: 7px 13px 8px; font-family: var(--font-display);
}
.plate .ga { font-style: italic; font-weight: 500; font-size: .8em; opacity: .92; }
.plate .en { font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }

.hero { display: grid; gap: 22px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: end; }
@media (max-width: 820px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero .plate { font-size: 1.1rem; padding: 12px 20px 14px; margin-bottom: 18px; }
.hero h1 { max-width: 16ch; }
.hero p.lead { font-size: 1.1rem; max-width: 52ch; margin-top: 14px; color: var(--muted); }
.hero-side { display: flex; flex-direction: column; gap: 10px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; min-height: 42px;
}
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }
.btn.primary:hover { filter: brightness(1.12); }
.btn.sm { min-height: 34px; padding: 5px 12px; font-size: .9rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.chip {
  display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 99px; font-size: .8rem; font-weight: 700;
  border: 1.5px solid currentColor; line-height: 1.4;
}
.chip.a2 { color: var(--lv-a2); } .chip.b1 { color: var(--lv-b1); } .chip.b2 { color: var(--lv-b2); }
.chipbtn { cursor: pointer; background: transparent; color: var(--muted); border-color: var(--line); }
.chipbtn[aria-pressed="true"] { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }

/* progress */
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--sign); border-radius: 99px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }

/* section heads */
.shead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--fg); padding-bottom: 8px; }
.shead p { color: var(--muted); font-size: .95rem; }

/* tiles */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.tile {
  display: flex; flex-direction: column; gap: 6px; padding: 16px; text-decoration: none; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0;
}
.tile:hover { border-color: var(--fg); }
.tile h3 { font-size: 1.1rem; }
.tile p { color: var(--muted); font-size: .92rem; }

.units { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }
.unit {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 12px 14px; text-decoration: none; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px;
}
.unit:hover { border-color: var(--fg); }
.unit .plate { font-size: .85rem; padding: 6px 10px 7px; min-width: 54px; align-items: center; }
.unit b { display: block; font-family: var(--font-display); font-size: 1.02rem; line-height: 1.2; }
.unit span.es { color: var(--muted); font-size: .86rem; }
.score { font-variant-numeric: tabular-nums; font-weight: 700; font-size: .85rem; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.score.done { background: var(--ok-bg); color: var(--ok); }

/* unit page */
.uhead { display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px; border-bottom: 2px solid var(--fg); }
.uhead .plate { font-size: 1rem; align-self: flex-start; }
.crumbs { font-size: .9rem; color: var(--muted); }
.crumbs a { color: var(--muted); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 40px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } .toc { display: none; } }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
.toc a { color: var(--muted); text-decoration: none; padding: 4px 0; border-bottom: 1px solid var(--line); }
.toc a:hover { color: var(--fg); }
.theory { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.theory h3 { padding-top: 10px; scroll-margin-top: 90px; }
.theory p { max-width: 68ch; }
.theory ul { margin: 0; padding-left: 1.2em; max-width: 68ch; }
.theory li + li { margin-top: 4px; }

.tblw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.mono, .mono { font-family: var(--font-mono); font-size: .86rem; }
.tnote { font-size: .86rem; color: var(--muted); padding: 8px 12px; border-top: 1px solid var(--line); }

.form { display: grid; grid-template-columns: auto minmax(0, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.form > div { padding: 10px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.form > div:nth-last-child(-n+2) { border-bottom: 0; }
.form .k { font-family: var(--font-mono); font-weight: 700; background: var(--surface-2); display: flex; align-items: center; justify-content: center; min-width: 52px; }
.form .v .pat { font-family: var(--font-mono); font-size: .88rem; }
.form .v .eg { font-family: var(--font-display); font-size: 1.05rem; font-weight: 500; margin-top: 2px; }

.exlist { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.exlist > div { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 1px; }
.exlist > div:last-child { border-bottom: 0; }
.exlist .en { font-family: var(--font-display); font-size: 1.08rem; font-weight: 500; }
.exlist .es { color: var(--muted); font-size: .88rem; }
.say { border: 0; background: transparent; cursor: pointer; padding: 2px 4px; color: var(--muted); vertical-align: middle; border-radius: 4px; }
.say:hover { color: var(--fg); }
.say svg { width: 18px; height: 18px; display: block; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .tag { font-family: var(--font-mono); font-size: .82rem; padding: 3px 9px; background: var(--surface-2); border-radius: 5px; }

.tip { border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px 12px; background: var(--surface); max-width: 68ch; }
.tip .lbl { display: block; margin-bottom: 4px; }
.tip.ie { border-color: var(--sign); }
.tip.ie .lbl { color: var(--sign); }
:root[data-theme="dark"] .tip.ie .lbl { color: var(--lv-b1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tip.ie .lbl { color: var(--lv-b1); } }

.errs { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.errs > div { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.errs > div:last-child { border-bottom: 0; }
.errs .bad { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.errs .good { color: var(--ok); font-weight: 600; }
.errs .why { color: var(--muted); font-size: .88rem; }

.cta-end { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

/* quiz */
.quiz { display: flex; flex-direction: column; gap: 18px; max-width: 720px; }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .9rem; color: var(--muted); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.qtext { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; line-height: 1.3; }
.qtext input.blank {
  font-family: var(--font-display); font-size: 1.1rem; border: 0; border-bottom: 2.5px solid var(--fg); background: var(--hi-soft);
  padding: 2px 8px; width: min(15ch, 60vw); border-radius: 4px 4px 0 0; text-align: center; margin: 0 3px;
}
.opts { display: grid; gap: 8px; }
.opt {
  text-align: left; padding: 12px 14px; border: 1.5px solid var(--line); background: var(--bg); border-radius: 8px; cursor: pointer; font-size: 1rem; min-height: 46px;
}
.opt:hover:not([disabled]) { border-color: var(--fg); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); font-weight: 700; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.opt[disabled] { cursor: default; }
.bank, .answer { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; padding: 8px; border-radius: 8px; }
.answer { border: 1.5px dashed var(--line); background: var(--bg); align-items: flex-start; }
.tileword {
  padding: 7px 12px; border: 1.5px solid var(--fg); background: var(--surface); border-radius: 7px; cursor: pointer; font-family: var(--font-display); font-weight: 500; font-size: 1.05rem;
}
.tileword.used { visibility: hidden; }
.fb { padding: 12px 14px; border-radius: 8px; font-size: .96rem; }
.fb.ok { background: var(--ok-bg); color: var(--ok); }
.fb.no { background: var(--bad-bg); color: var(--bad); }
.fb b { display: block; }
.fb span { color: var(--fg); }
.result { text-align: left; display: flex; flex-direction: column; gap: 16px; }
.result .big { font-family: var(--font-display); font-weight: 800; font-size: 3.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.missed { display: flex; flex-direction: column; gap: 8px; }
.missed > div { padding: 10px 12px; background: var(--surface-2); border-radius: 8px; font-size: .94rem; }

/* conjugator */
.ctl { display: grid; gap: 16px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.fields { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field input[type=text], .field input[type=search], .field input[type=date], .field select {
  border: 1.5px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 12px; min-height: 42px; width: 100%;
}
.seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--muted); min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--sign); color: var(--sign-ink); }
.vinfo { display: flex; flex-wrap: wrap; gap: 8px 26px; padding: 14px 18px; background: var(--surface-2); border-radius: 10px; align-items: baseline; }
.vinfo > div { display: flex; flex-direction: column; }
.vinfo b { font-family: var(--font-display); font-size: 1.2rem; }
.cj th.tn { text-transform: none; letter-spacing: 0; font-size: .95rem; color: var(--fg); background: var(--surface); white-space: normal; min-width: 150px; }
.cj td b, .cj td .vb { background: var(--hi-soft); padding: 0 .2em; border-radius: 3px; font-weight: 600; }
.cj td { font-family: var(--font-mono); font-size: .86rem; }
.cj td.name { font-family: var(--font-body); }
.cj td .use { display: block; font-family: var(--font-body); color: var(--muted); font-size: .8rem; margin-top: 2px; }
.cj tr.grp td { background: var(--surface-2); font-family: var(--font-display); font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.note { font-size: .88rem; color: var(--muted); }
.warn { background: var(--hi-soft); padding: 8px 12px; border-radius: 8px; font-size: .9rem; }

/* flashcards */
.fc {
  width: 100%; max-width: 560px; min-height: 240px; padding: 28px; border: 1.5px solid var(--fg); border-radius: 12px; background: var(--surface); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center;
}
.fc .w { font-family: var(--font-display); font-weight: 700; font-size: 2.1rem; line-height: 1.1; }
.fc .eg { font-size: 1rem; color: var(--muted); max-width: 40ch; }
.fc .hint { font-size: .8rem; color: var(--muted); }

/* dialogue */
.dlg { display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
.line { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.line .who { font-size: .76rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
.line .en { font-family: var(--font-display); font-size: 1.08rem; font-weight: 500; }
.line .es { color: var(--muted); font-size: .88rem; }
.line.hide .en { filter: blur(7px); user-select: none; cursor: pointer; }
.hide-es .line .es { display: none; }
@media (max-width: 480px) { .line { grid-template-columns: minmax(0, 1fr); gap: 0; } }

.search { max-width: 360px; }
.week { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.week input { width: 22px; height: 22px; margin-top: 3px; accent-color: var(--sign); }
.week.now { background: var(--hi-soft); padding-inline: 12px; margin-inline: -12px; border-radius: 8px; }
.week .wn { font-family: var(--font-display); font-weight: 700; }

</style>
<div id="app"></div>
<script>
/* ---------- Core: helpers, storage, speech, quiz runner ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const stripTags = s => String(s).replace(/<[^>]*>/g, '');
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function pick(a, n) { return shuffle(a).slice(0, n); }

/* answer normaliser: case, punctuation and contractions do not matter */
function norm(s) {
  return String(s).toLowerCase().replace(/[’‘`]/g, "'").replace(/[.?!,;:"“”]+/g, ' ')
    .replace(/\bcan't\b/g, 'can not').replace(/\bcannot\b/g, 'can not').replace(/\bwon't\b/g, 'will not').replace(/\bshan't\b/g, 'shall not')
    .replace(/\b(he|she|it|that|there|here|what|who|where|how|when|why)'s\s+(been|got|had)\b/g, '$1 has $2')
    .replace(/\b(he|she|it|that|there|here|what|who|where|how|when|why)'s\b/g, '$1 is')
    .replace(/\b(i|you|he|she|it|we|they|who|there)'d\s+(better|been|had)\b/g, '$1 had $2')
    .replace(/\b(i|you|he|she|it|we|they|who|there)'d\b/g, '$1 would')
    .replace(/n't\b/g, ' not').replace(/'m\b/g, ' am').replace(/'re\b/g, ' are').replace(/'ve\b/g, ' have').replace(/'ll\b/g, ' will')
    .replace(/\s+/g, ' ').trim();
}

/* storage: localStorage when available, memory otherwise */
const KEY = 'ingles-irlanda-v1';
let P = {};
try { P = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { P = {}; }
['units', 'wrong', 'vocab', 'weeks'].forEach(k => { P[k] = P[k] || {}; });
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) { /* memory only */ } }

/* speech */
const CAN_SAY = (() => { try { return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined'; } catch (e) { return false; } })();
const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|princess|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley/i;
function voiceScore(v) {
  const n = v.name + ' ' + (v.voiceURI || '');
  if (!/^en/i.test(v.lang)) return -1e9;
  let q = 0;
  if (/natural|neural|online/i.test(n)) q += 100;
  if (/premium/i.test(n)) q += 80;
  if (/siri/i.test(n)) q += 70;
  if (/enhanced/i.test(n)) q += 60;
  if (/google/i.test(n)) q += 50;
  if (/compact|espeak|festival/i.test(n)) q -= 60;
  if (NOVELTY.test(v.name)) q -= 300;
  const l = v.lang.replace('_', '-').toLowerCase();
  if (l === 'en-ie') q += 30; else if (l === 'en-gb') q += 25; else if (l === 'en-us') q += 8; else q += 2;
  if (!v.localService) q += 5;
  return q;
}
function enVoices() {
  let vs = []; try { vs = speechSynthesis.getVoices(); } catch (e) { /* ignore */ }
  return vs.filter(v => /^en/i.test(v.lang)).sort((a, b) => voiceScore(b) - voiceScore(a));
}
function pickVoice() {
  const vs = enVoices();
  return vs.find(v => v.voiceURI === P.voice) || vs[0] || null;
}
function say(text) {
  if (!CAN_SAY) return;
  try {
    speechSynthesis.cancel();
    const clean = stripTags(text).replace(/\.{3}/g, '. ').replace(/\s+/g, ' ').trim();
    const parts = clean.match(/[^.?!]+[.?!]*/g) || [clean];
    const v = pickVoice();
    parts.map(x => x.trim()).filter(x => /[A-Za-z]/.test(x)).forEach(part => {
      const u = new SpeechSynthesisUtterance(part);
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
      u.rate = P.rate || 0.95;
      u.pitch = 1;
      speechSynthesis.speak(u);
    });
  } catch (e) { /* ignore */ }
}
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const sayBtn = t => CAN_SAY ? `<button class="say" type="button" data-say="${esc(stripTags(t))}" aria-label="Escuchar en inglés" title="Escuchar">${SPEAKER}</button>` : '';

/* ---------- Quiz runner ---------- */
function orderTiles(sentence) {
  const w = sentence.split(' ');
  let s = w.map((t, i) => ({ t, i }));
  if (w.length > 1) { for (let k = 0; k < 8; k++) { s = shuffle(s); if (s.some((x, idx) => x.i !== idx)) break; } }
  return s;
}

function runQuiz(host, items, opt) {
  opt = opt || {};
  let i = 0, right = 0;
  const missed = [];

  function frame() {
    host.innerHTML = `<div class="quiz">
      <div class="qtop"><span>${esc(opt.title || '')}</span><span aria-live="polite">${i + 1} / ${items.length}</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${(i / items.length) * 100}%"></i></div>
      <div class="qcard" id="qc"></div>
      <div id="fbw" aria-live="polite"></div></div>`;
  }

  function finish(ok, it, answerText) {
    if (ok) right++; else missed.push({ it, answerText });
    if (it.id) { if (ok) delete P.wrong[it.id]; else P.wrong[it.id] = 1; save(); }
    const fb = $('#fbw', host);
    const last = i === items.length - 1;
    const why = it.w ? ` ${it.w}` : '';
    fb.innerHTML = (ok
      ? `<div class="fb ok"><b>Correcto.</b><span>${why}</span></div>`
      : `<div class="fb no"><b>Todavía no.</b><span>Respuesta: <strong>${esc(answerText)}</strong>.${why}</span></div>`)
      + `<div class="row" style="margin-top:14px"><button class="btn primary" id="next" type="button">${last ? 'Ver resultado' : 'Siguiente'}</button></div>`;
    const nb = $('#next', host);
    nb.focus();
    nb.addEventListener('click', () => { if (last) result(); else { i++; render(); } });
  }

  function render() {
    frame();
    const it = items[i];
    const qc = $('#qc', host);
    if (it.t === 'mc') drawMC(qc, it);
    else if (it.t === 'fill') drawFill(qc, it);
    else if (it.t === 'dict') drawDict(qc, it);
    else drawOrder(qc, it);
  }

  function drawMC(qc, it) {
    const opts = shuffle(it.o.map((t, k) => ({ t, ok: k === it.a })));
    qc.innerHTML = `<div class="qtext">${it.q}</div><div class="opts">${opts.map((o, k) => `<button class="opt" type="button" data-k="${k}">${esc(o.t)}</button>`).join('')}</div>`;
    $$('.opt', qc).forEach(b => b.addEventListener('click', () => {
      const o = opts[+b.dataset.k];
      $$('.opt', qc).forEach((x, k) => { x.disabled = true; if (opts[k].ok) x.classList.add('right'); });
      if (!o.ok) b.classList.add('wrong');
      finish(o.ok, it, it.o[it.a]);
    }));
  }

  function drawFill(qc, it) {
    const inp = `<input class="blank${it.q.indexOf('___') >= 0 ? '' : ' wide'}" id="blank" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Tu respuesta">`;
    const q = it.q.indexOf('___') >= 0 ? it.q.replace('___', inp) : it.q + ' ' + inp;
    qc.innerHTML = `<div class="qtext">${q}</div><div class="row"><button class="btn primary" id="chk" type="button">Comprobar</button></div>`;
    const el = $('#blank', qc);
    el.focus();
    let done = false;
    const check = () => {
      if (done || !el.value.trim()) return;
      done = true; el.disabled = true; $('#chk', qc).disabled = true;
      const ok = it.a.map(norm).includes(norm(el.value));
      finish(ok, it, it.a[0]);
    };
    $('#chk', qc).addEventListener('click', check);
    el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  }

  function drawDict(qc, it) {
    const sound = CAN_SAY
      ? `<div class="row"><button class="btn" id="hear" type="button">${SPEAKER} Escuchar</button><button class="btn" id="slow" type="button">Más lento</button></div>`
      : `<div class="warn">Este navegador no tiene voz. Lee la frase y escríbela de memoria: <b>${esc(it.s)}</b></div>`;
    qc.innerHTML = `<div class="qtext">Escucha y escribe lo que oyes.</div>${sound}
      <input class="blank wide" id="blank" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Lo que oyes">
      <div class="row"><button class="btn primary" id="chk" type="button">Comprobar</button></div>`;
    const el = $('#blank', qc);
    const play = r => { const old = P.rate; P.rate = r; say(it.s); P.rate = old; };
    if (CAN_SAY) {
      $('#hear', qc).addEventListener('click', () => play(0.95));
      $('#slow', qc).addEventListener('click', () => play(0.7));
      setTimeout(() => play(0.95), 250);
    }
    el.focus();
    let done = false;
    const check = () => {
      if (done || !el.value.trim()) return;
      done = true; el.disabled = true; $('#chk', qc).disabled = true;
      const ok = [it.s].concat(it.alt || []).map(norm).includes(norm(el.value));
      finish(ok, it, it.s);
    };
    $('#chk', qc).addEventListener('click', check);
    el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  }

  function drawOrder(qc, it) {
    const tiles = orderTiles(it.s);
    const chosen = [];
    qc.innerHTML = `<div class="qtext">Ordena las palabras para formar una frase.</div>
      <div class="answer" id="ans" aria-label="Tu frase"></div>
      <div class="bank" id="bank"></div>
      <div class="row"><button class="btn primary" id="chk" type="button" disabled>Comprobar</button><button class="btn" id="clr" type="button">Borrar</button></div>`;
    const ans = $('#ans', qc), bank = $('#bank', qc), chk = $('#chk', qc);
    let done = false;
    function draw() {
      bank.innerHTML = tiles.map((x, k) => `<button type="button" class="tileword${chosen.includes(k) ? ' used' : ''}" data-k="${k}">${esc(x.t)}</button>`).join('');
      ans.innerHTML = chosen.map(k => `<button type="button" class="tileword" data-r="${k}">${esc(tiles[k].t)}</button>`).join('');
      chk.disabled = chosen.length !== tiles.length;
    }
    qc.addEventListener('click', e => {
      if (done) return;
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.k !== undefined && !chosen.includes(+b.dataset.k)) { chosen.push(+b.dataset.k); draw(); }
      else if (b.dataset.r !== undefined) { chosen.splice(chosen.indexOf(+b.dataset.r), 1); draw(); }
      else if (b.id === 'clr') { chosen.length = 0; draw(); }
      else if (b.id === 'chk' && !chk.disabled) {
        done = true; chk.disabled = true;
        const given = chosen.map(k => tiles[k].t).join(' ');
        const ok = [it.s].concat(it.alt || []).map(norm).includes(norm(given));
        finish(ok, it, it.s + '.');
      }
    });
    draw();
  }

  function result() {
    const pct = Math.round((right / items.length) * 100);
    host.innerHTML = `<div class="quiz"><div class="qcard result">
      <div class="lbl">${esc(opt.title || 'Resultado')}</div>
      <div class="big">${right}/${items.length}</div>
      <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <p>${pct >= 85 ? 'Muy bien. Dominas este tema.' : pct >= 60 ? 'Buen avance. Repasa los errores y vuelve a intentarlo.' : 'Aún falta práctica. Relee la teoría y repite la serie.'}</p>
      ${missed.length ? `<div class="missed"><h4>Para repasar</h4>${missed.map(m => `<div>${m.it.t === 'order' ? 'Frase: ' : ''}${m.it.q ? stripTags(m.it.q).replace('___', '…') : ''} <strong>${esc(m.answerText)}</strong></div>`).join('')}</div>` : ''}
      <div class="row" id="after"><button class="btn primary" id="again" type="button">Repetir</button></div></div></div>`;
    $('#again', host).addEventListener('click', () => runQuiz(host, opt.reshuffle ? opt.reshuffle() : items, opt));
    if (opt.onDone) opt.onDone({ right, total: items.length, pct, host, missed: missed.map(m => m.it) });
  }

  render();
}

/* ---------- exercise constructors used by the data files ---------- */
const mc = (q, o, a, w) => ({ t: 'mc', q, o, a, w });
const fill = (q, a, w) => ({ t: 'fill', q, a: Array.isArray(a) ? a : [a], w });
const ord = (s, w, alt) => ({ t: 'order', s, w, alt });

/* ---------- theory block constructors ---------- */
const H = t => ({ t: 'h', h: t });
const Pp = h => ({ t: 'p', h });
const UL = items => ({ t: 'ul', items });
const TBL = (head, rows, note) => ({ t: 'tbl', head, rows, note });
const FORM = rows => ({ t: 'form', rows });
const EX = items => ({ t: 'ex', items });
const TIP = (label, h, ie) => ({ t: 'tip', label, h, ie });
const ERR = items => ({ t: 'err', items });
const CHIPS = (label, items) => ({ t: 'chips', label, items });
/* ---------- Conjugation logic (pure; also tested in node) ---------- */
const SUBJ = ['I', 'you', 'he', 'she', 'it', 'we', 'they'];
const MODAL_BASES = ['can', 'could', 'may', 'might', 'must', 'shall', 'should', 'will', 'would'];

const TENSES = [
  { id: 'ps',  g: 'Presente', en: 'Present Simple', es: 'Presente simple', use: 'Rutinas, hechos, horarios',
    f: ['subject + verb (+s)', 'subject + do/does + not + verb', 'do/does + subject + verb?'] },
  { id: 'pc',  g: 'Presente', en: 'Present Continuous', es: 'Presente continuo', use: 'Ahora, temporal, planes cerrados',
    f: ['subject + am/is/are + verb-ing', 'subject + am/is/are + not + verb-ing', 'am/is/are + subject + verb-ing?'] },
  { id: 'pp',  g: 'Presente', en: 'Present Perfect', es: 'Presente perfecto', use: 'Pasado con conexión al presente',
    f: ['subject + have/has + past participle', 'subject + have/has + not + past participle', 'have/has + subject + past participle?'] },
  { id: 'ppc', g: 'Presente', en: 'Present Perfect Continuous', es: 'Presente perfecto continuo', use: 'Duración hasta ahora',
    f: ['subject + have/has + been + verb-ing', 'subject + have/has + not + been + verb-ing', 'have/has + subject + been + verb-ing?'] },
  { id: 'pas', g: 'Pasado', en: 'Past Simple', es: 'Pasado simple', use: 'Acciones terminadas',
    f: ['subject + past simple', 'subject + did + not + verb', 'did + subject + verb?'] },
  { id: 'pac', g: 'Pasado', en: 'Past Continuous', es: 'Pasado continuo', use: 'Acción en progreso en el pasado',
    f: ['subject + was/were + verb-ing', 'subject + was/were + not + verb-ing', 'was/were + subject + verb-ing?'] },
  { id: 'pap', g: 'Pasado', en: 'Past Perfect', es: 'Pasado perfecto', use: 'Antes de otro momento del pasado',
    f: ['subject + had + past participle', 'subject + had + not + past participle', 'had + subject + past participle?'] },
  { id: 'papc', g: 'Pasado', en: 'Past Perfect Continuous', es: 'Pasado perfecto continuo', use: 'Duración antes de otro momento',
    f: ['subject + had + been + verb-ing', 'subject + had + not + been + verb-ing', 'had + subject + been + verb-ing?'] },
  { id: 'fs',  g: 'Futuro', en: 'Future Simple', es: 'Futuro con will', use: 'Decisiones, promesas, predicciones',
    f: ['subject + will + verb', 'subject + will + not + verb', 'will + subject + verb?'] },
  { id: 'gt',  g: 'Futuro', en: 'Be going to', es: 'Futuro con going to', use: 'Planes e intenciones',
    f: ['subject + am/is/are + going to + verb', 'subject + am/is/are + not + going to + verb', 'am/is/are + subject + going to + verb?'] },
  { id: 'fc',  g: 'Futuro', en: 'Future Continuous', es: 'Futuro continuo', use: 'En progreso en un momento futuro',
    f: ['subject + will + be + verb-ing', 'subject + will + not + be + verb-ing', 'will + subject + be + verb-ing?'] },
  { id: 'fp',  g: 'Futuro', en: 'Future Perfect', es: 'Futuro perfecto', use: 'Terminado antes de un momento futuro',
    f: ['subject + will + have + past participle', 'subject + will + not + have + past participle', 'will + subject + have + past participle?'] },
  { id: 'fpc', g: 'Futuro', en: 'Future Perfect Continuous', es: 'Futuro perfecto continuo', use: 'Duración hasta un momento futuro',
    f: ['subject + will + have + been + verb-ing', 'subject + will + not + have + been + verb-ing', 'will + subject + have + been + verb-ing?'] },

  FORM([['+', 'subject + am / is / are + verb-ing', `She<mark>'s eating</mark> toast.`], ['−', 'subject + am / is / are + not + verb-ing', `He <mark>isn't eating</mark>.`], ['?', '(question word +) am / is / are + subject + verb-ing?', `What <mark>are</mark> they <mark>eating</mark>?`]]),
  TBL(['Ortografía del -ing', 'Ejemplos'], [['Normal: + ing', 'work → working'], ['Termina en -e: quita la e', 'make → making · come → coming'], ['Consonante-vocal-consonante corta: duplica', 'run → running · stop → stopping · begin → beginning'],
    ['-ie → -ying', 'lie → lying · die → dying'], ['Termina en -l tras vocal (inglés británico): duplica', 'travel → travelling']]),
  H('Cuándo se usa'),
  UL([`<b>Ahora mismo:</b> I'm working at the moment.`, `<b>Situaciones temporales:</b> I'm living in Cork for six months.`, `<b>Hábitos nuevos o temporales:</b> He's eating a lot these days.`,
    `<b>Hábitos molestos</b> (con always): You're always losing your keys!`, `<b>Planes cerrados</b> (con un momento futuro): I'm meeting my landlord tomorrow.`]),
  CHIPS('Marcadores de tiempo', ['now', 'right now', 'at the moment', 'today', 'these days', 'this week', 'tonight', 'tomorrow', 'next Friday']),
  EX([[`I<mark>'m working</mark> at the moment.`, 'Estoy trabajando en este momento.'], [`It<mark>'s raining</mark> again.`, 'Está lloviendo otra vez.'], [`She<mark>'s staying</mark> with a friend for a week.`, 'Se queda con una amiga una semana.'],
    [`<mark>Are</mark> you <mark>coming</mark> to the party tonight?`, '¿Vienes a la fiesta esta noche?'], [`We<mark>'re moving</mark> house in June.`, 'Nos mudamos en junio.']]),
  H('Verbos de estado'),
  Pp(`Los verbos que describen estados, no acciones, no suelen ir en continuo. Algunos cambian de significado y sí admiten continuo.`),
  TBL(['Tipo', 'Verbos', 'Con otro significado'], [['Sentidos y percepción', 'see, hear, smell, taste, notice', 'I\'m seeing a friend (quedar). She\'s tasting the soup (probar).'], ['Emociones y deseos', 'like, love, hate, want, need, prefer', ''],
    ['Pensamiento', 'know, understand, believe, remember, forget', 'I\'m thinking about moving (considerar).'], ['Posesión', 'have (tener), own, belong', 'I\'m having lunch (comer).'], ['Otros', 'be, cost, seem, weigh', '']]),
  TBL(['Present Simple (permanente)', 'Present Continuous (temporal)'], [['I live in Cork. (es mi casa)', 'I\'m living in Cork. (por ahora)'], ['I work in a school.', 'I\'m working in a school until I find a job in my field.']]),
  H('Errores típicos'),
  ERR([['I am knowing the answer.', 'I know the answer.', '<i>Know</i> es un verbo de estado.'], ['I\'m wanting a coffee.', 'I want a coffee.', '<i>Want</i> no se usa en continuo.'], ['She is work now.', 'She is working now.', 'Después de is hace falta -ing.'],
    ['What you doing?', 'What are you doing?', 'Falta el auxiliar are.'], ['I\'m agree with you.', 'I agree with you.', 'No se usa continuo ni am con agree.']])
], [
  mc('Be quiet! The baby ___.', ['is sleeping', 'sleeps', 'sleep', 'does sleeping'], 0, 'Acción en este momento: presente continuo.'),
  fill('They ___ (have) lunch at the moment.', ['are having'], 'Aquí <i>have</i> = comer, y sí admite continuo.'),
  mc('I ___ you. Please say it again.', ['don\'t understand', '\'m not understanding', 'am not understand', 'don\'t understanding'], 0, '<i>Understand</i> es un verbo de estado.'),
  fill('Look! It ___ (rain).', ['is raining', '\'s raining'], 'Ahora mismo: is raining.'),
  mc('I ___ in Cork until June, then I\'m moving to Dublin.', ['am living', 'live', 'lives', 'do live'], 0, 'Situación temporal: presente continuo.'),
  ord('What are you doing this weekend', 'Pregunta en presente continuo; sirve también para planes.'),
  mc('We ___ to Galway on Saturday. We\'ve bought the tickets.', ['are going', 'go', 'will to go', 'going'], 0, 'Plan ya organizado: presente continuo.')
]));

UNITS.push(U(4, 'A2', 'Past Simple', 'Acciones terminadas en el pasado', [
  Pp(`El <b>Past Simple</b> es el pasado básico. Se usa para acciones, estados y hábitos terminados, casi siempre con una marca de tiempo pasada (yesterday, last week, in 2019).`),
  H('Formas'),
  FORM([['+', 'subject + past simple (verb + ed / irregular)', `I <mark>ate</mark> an apple. She <mark>worked</mark> late.`], ['−', 'subject + did + not + verb', `She <mark>didn't eat</mark> anything.`], ['?', '(question word +) did + subject + verb?', `What <mark>did</mark> they <mark>eat</mark> for lunch?`], ['be', 'was / were', `I <mark>was</mark> hungry. They <mark>were</mark> in a restaurant.`]]),
  TBL(['Regla del -ed', 'Ejemplos'], [['Normal: + ed', 'work → worked · play → played'], ['Termina en -e: + d', 'live → lived · decide → decided'], ['Consonante + y: y → ied', 'study → studied · try → tried'],
    ['Corto con consonante-vocal-consonante: duplica', 'stop → stopped · plan → planned'], ['Termina en -l (inglés británico): duplica', 'travel → travelled · cancel → cancelled']], 'Los verbos irregulares (go → went, see → saw, buy → bought…) están en la sección Listas.'),
  CHIPS('Marcadores de tiempo', ['yesterday', 'last night', 'last week', 'two days ago', 'in 2019', 'when I was a child', 'on Monday']),
  EX([[`I <mark>went</mark> to the cinema yesterday.`, 'Fui al cine ayer.'], [`We <mark>didn't see</mark> the match.`, 'No vimos el partido.'], [`<mark>Did</mark> you <mark>get</mark> my message?`, '¿Recibiste mi mensaje?'],
    [`Where <mark>did</mark> you <mark>live</mark> before?`, '¿Dónde vivías antes?'], [`He <mark>was</mark> late because the bus <mark>was</mark> delayed.`, 'Llegó tarde porque el autobús se retrasó.']]),
  H('Hábitos del pasado: used to'),
  Pp(`<b>Used to + verbo</b> habla de hábitos o estados que ya no existen. Negativo: <i>didn’t use to</i>. Pregunta: <i>Did you use to…?</i>`),
  EX([[`I <mark>used to live</mark> in Mexico City.`, 'Antes vivía en Ciudad de México.'], [`We <mark>didn't use to</mark> have a car.`, 'Antes no teníamos coche.']]),
  TIP('Pronunciación del -ed', `Se pronuncia /t/ en <i>worked</i>, /d/ en <i>played</i> y /ɪd/ en <i>wanted</i> y <i>needed</i>. No se pronuncia “ed” siempre.`),
  H('Errores típicos'),
  ERR([['I didn\'t went to work.', 'I didn\'t go to work.', 'Después de did / didn\'t, el verbo va en base.'], ['Did you saw him?', 'Did you see him?', 'Igual: did + verbo base.'], ['I goed to Cork.', 'I went to Cork.', '<i>Go</i> es irregular.'],
    ['Yesterday I am tired.', 'Yesterday I was tired.', 'Con una marca de pasado, verbo en pasado.'], ['I was agree.', 'I agreed.', '<i>Agree</i> es un verbo normal.']])
], [
  mc('She ___ to Dublin last week.', ['went', 'goes', 'gone', 'go'], 0, 'Pasado irregular de go: went.'),
  fill('We ___ (not / see) the film.', ['didn\'t see', 'did not see'], 'Negativo: didn\'t + verbo base.'),
  mc('___ you enjoy the concert?', ['Did', 'Do', 'Were', 'Have'], 0, 'Pregunta en pasado: Did + sujeto + verbo base.'),
  fill('I ___ (buy) a Leap Card yesterday.', ['bought'], 'Buy es irregular: bought.'),
  ord('Did you finish your homework last night', 'Did + sujeto + verbo base.'),
  fill('I ___ in Mexico City when I was a child. (used to + live)', ['used to live'], 'Hábito o estado del pasado: used to + verbo base.'),
  mc('He ___ the bus because he was late.', ['missed', 'miss', 'was missing', 'has missed'], 0, 'Acción terminada: past simple.')
]));

UNITS.push(U(5, 'A2', 'Past Continuous', 'Acciones en progreso y escenas del pasado', [
  Pp(`El <b>Past Continuous</b> describe una acción que estaba en progreso en un momento del pasado. Se usa mucho para el fondo de una historia y para acciones largas interrumpidas por otras cortas.`),
  H('Formas'),
  FORM([['+', 'subject + was / were + verb-ing', `I <mark>was eating</mark>. They <mark>were eating</mark> lunch.`], ['−', 'subject + was / were + not + verb-ing', `You <mark>weren't eating</mark>.`], ['?', '(question word +) was / were + subject + verb-ing?', `Where <mark>were</mark> you <mark>eating</mark>?`]]),
  H('Cuándo se usa'),
  UL([`<b>Acción en progreso en un momento concreto:</b> At 8 p.m. I was cooking.`, `<b>Acciones simultáneas</b> (con while): While I was cooking, he was cleaning.`, `<b>Acción larga interrumpida por otra corta:</b> I was walking home when it started to rain.`, `<b>Escena de fondo en una historia:</b> The sun was shining and people were laughing.`]),
  TBL(['Acción larga (past continuous)', 'Acción corta (past simple)'], [['I was walking home', 'when it started to rain.'], ['While she was cooking,', 'the phone rang.'], ['They were waiting for the bus', 'when I saw them.']], 'when + past simple (la acción corta). while + past continuous (la acción larga).'),
  CHIPS('Marcadores de tiempo', ['while', 'when', 'as', 'at 8 o\'clock last night', 'all day', 'at that moment']),
  EX([[`I <mark>was watching</mark> TV when you called.`, 'Estaba viendo la tele cuando llamaste.'], [`What <mark>were</mark> you <mark>doing</mark> at ten?`, '¿Qué estabas haciendo a las diez?'], [`It <mark>was raining</mark> and the wind <mark>was blowing</mark>.`, 'Llovía y soplaba el viento.']]),
  TIP('', `Los verbos de estado (know, want, like…) no se usan en continuo, tampoco en pasado: “I knew the answer”, no “I was knowing”.`),
  H('Errores típicos'),
  ERR([['I was walk home.', 'I was walking home.', 'Después de was / were hace falta -ing.'], ['When I was arrive, he left.', 'When I arrived, he left.', 'La acción corta va en past simple.'], ['While I walked, it started raining.', 'While I was walking, it started to rain.', 'La acción larga con while va en continuo.']])
], [
  mc('I ___ TV when you called.', ['was watching', 'watched', 'am watching', 'have watched'], 0, 'Acción en progreso interrumpida: past continuous.'),
  fill('She ___ (cook) dinner when the lights went out.', ['was cooking'], 'Acción larga: was + -ing.'),
  mc('While we ___ in Cork, we met an old friend.', ['were staying', 'stayed', 'are staying', 'was staying'], 0, 'We → were.'),
  mc('What ___ you doing at 9 p.m. last night?', ['were', 'was', 'did', 'are'], 0, 'You → were.'),
  ord('They were waiting for the bus when it started to rain', 'Acción larga (were waiting) + acción corta (started).'),
  fill('I ___ (not / sleep) when you arrived.', ['wasn\'t sleeping', 'was not sleeping'], 'Negativo: wasn\'t + -ing.'),
  mc('It ___ when we left the house, so we took umbrellas.', ['was raining', 'rained', 'is raining', 'has rained'], 0, 'Escena de fondo: past continuous.')
]));

UNITS.push(U(6, 'A2', 'Talking about the future', 'Will, going to, presente continuo y presente simple', [
  Pp(`En inglés hay varias formas de hablar del futuro y cada una transmite una idea distinta. No es solo “will”.`),
  H('Cuál elegir'),
  TBL(['Forma', 'Para qué', 'Ejemplo'], [['will + verbo', 'Decisiones espontáneas, promesas, ofertas, predicciones (opinión)', 'I\'ll have the soup, please. I think it will rain.'],
    ['be going to + verbo', 'Planes e intenciones; predicciones con evidencia', 'We\'re going to move next year. Look at those clouds!'], ['presente continuo', 'Planes ya organizados, con día u hora', 'I\'m meeting my landlord at six.'],
    ['presente simple', 'Horarios y calendarios', 'The train leaves at 10:15.']]),
  H('Formas'),
  FORM([['+', 'subject + will + verb', `I <mark>will eat</mark> later.`], ['−', 'subject + will + not (won\'t) + verb', `We <mark>won't eat</mark> anything tonight.`], ['?', '(question word +) will + subject + verb?', `What <mark>will</mark> you <mark>eat</mark> for lunch?`], ['gt', 'subject + am / is / are + going to + verb', `She<mark>'s going to study</mark> in Cork.`]]),
  CHIPS('Marcadores de tiempo', ['tomorrow', 'next week', 'soon', 'in two months', 'tonight', 'this evening', 'I think', 'probably', 'perhaps']),
  EX([[`I<mark>'ll have</mark> the soup, please.`, 'Tomaré la sopa, por favor. (decisión en el momento)'], [`We<mark>'re going to move</mark> to Ireland next year.`, 'Vamos a mudarnos a Irlanda el año que viene.'], [`Look at the sky! It<mark>'s going to rain</mark>.`, '¡Mira el cielo! Va a llover.'],
    [`My flight <mark>leaves</mark> at 7:40.`, 'Mi vuelo sale a las 7:40.'], [`I<mark>'m meeting</mark> my landlord at six.`, 'Quedo con mi casero a las seis.']]),
  TIP('Después de when, if, until, as soon as', `No se usa will: <mark>I'll call you when I arrive</mark>, no “when I will arrive”. Detrás de estas palabras va el presente simple.`),
  H('Errores típicos'),
  ERR([['I will to go.', 'I will go.', 'Will va con verbo base, sin to.'], ['When I will arrive, I\'ll call you.', 'When I arrive, I\'ll call you.', 'Tras when va presente simple.'], ['I think I go to the cinema tonight.', 'I think I\'ll go to the cinema tonight.', 'Una decisión en el momento lleva will.']])
], [
  mc('The phone is ringing. I ___ it.', ['\'ll answer', 'am going to answer', 'answer', 'am answering'], 0, 'Decisión espontánea: will.'),
  mc('Look at those clouds! It ___ rain.', ['is going to', 'will to', 'is', 'does'], 0, 'Evidencia en el presente: going to.'),
  fill('We ___ (go) to Galway next weekend. We\'ve booked the hotel.', ['are going', 'are going to go'], 'Plan organizado: presente continuo o going to.'),
  mc('I\'ll call you when I ___ at the airport.', ['arrive', 'will arrive', 'am arriving', 'arrived'], 0, 'Después de when va presente simple.'),
  mc('The train ___ at 10:15 tomorrow.', ['leaves', 'will leaving', 'is leave', 'leave'], 0, 'Horario fijo: presente simple.'),
  ord('I think it will be a soft day tomorrow', 'Predicción con I think: will.'),
  fill('I promise I ___ (not / be) late.', ['won\'t be', 'will not be'], 'Promesa: will / won\'t.')
]));

UNITS.push(U(7, 'A2', 'Modal verbs 1', 'Can, could, may, would y should', [
  Pp(`Los <b>modales</b> se colocan antes de otro verbo para añadir una idea: habilidad, permiso, petición o consejo. Todos siguen la misma regla: <b>modal + verbo base</b>, sin -s, sin to y sin do / does.`),
  FORM([['+', 'subject + modal + verb', `She <mark>can swim</mark>.`], ['−', 'subject + modal + not + verb', `She <mark>can't swim</mark>.`], ['?', 'modal + subject + verb?', `<mark>Can</mark> she <mark>swim</mark>?`]]),
  H('Qué hace cada uno'),
  TBL(['Modal', 'Uso', 'Ejemplo'], [['can / can\'t', 'Habilidad, permiso informal, petición', 'I can swim. Can I sit here?'], ['could', 'Habilidad en pasado; petición educada', 'I could swim at five. Could you help me?'], ['may', 'Permiso formal', 'May I come in?'],
    ['would', 'Ofrecimientos y peticiones corteses', 'Would you like some tea?  I\'d like a coffee.'], ['should / shouldn\'t', 'Consejo y opinión', 'You should see a doctor.']]),
  EX([[`<mark>Can</mark> you help me, please?`, '¿Me puedes ayudar, por favor?'], [`<mark>Could</mark> I have the bill, please?`, '¿Podría traerme la cuenta, por favor?'], [`I <mark>couldn't</mark> open the door.`, 'No pude abrir la puerta.'],
    [`<mark>Would</mark> you like a cup of tea?`, '¿Le apetece una taza de té?'], [`You <mark>should</mark> take an umbrella. It <mark>might</mark> rain.`, 'Deberías llevar paraguas. Puede que llueva.']]),
  TIP('Ser educado', `En tiendas y cafeterías, <b>I’d like…</b> suena mucho más amable que <i>I want…</i>. Y <b>Could I…?</b> más amable que <i>Can I…?</i>`, true),
  H('Errores típicos'),
  ERR([['She cans swim.', 'She can swim.', 'Los modales no llevan -s.'], ['Can you to help me?', 'Can you help me?', 'Después de un modal no va <i>to</i>.'], ['Do you can swim?', 'Can you swim?', 'Los modales no usan do / does.'], ['I must to go.', 'I must go.', 'Modal + verbo base.']])
], [
  mc('___ you tell me the time, please?', ['Could', 'Are', 'Do', 'Have'], 0, 'Una petición cortés lleva could.'),
  mc('You ___ drink more water.', ['should', 'shoulds', 'must to', 'are should'], 0, 'Should da un consejo.'),
  fill('She ___ (can) swim when she was four.', ['could'], 'El pasado de can es could.'),
  mc('___ I open the window? It\'s very hot.', ['Can', 'Am', 'Do', 'Will'], 0, 'Para pedir permiso: Can I…?'),
  mc('Choose the correct sentence.', ['She can speak English.', 'She can speaks English.', 'She cans speak English.', 'She can to speak English.'], 0, 'Modal + verbo base, sin -s ni to.'),
  ord('Would you like a cup of tea', 'Would you like + sustantivo = ofrecimiento educado.'),
  fill('You ___ drive in this fog. It\'s dangerous. (should + not)', ['shouldn\'t', 'should not'], 'Consejo negativo: shouldn\'t + verbo base.')
]));

UNITS.push(U(8, 'A2', 'Countable and uncountable nouns', 'Contables, incontables, cantidades y artículos', [
  Pp(`Los sustantivos <b>contables</b> se pueden contar (a book, two books). Los <b>incontables</b> no (water, money, advice, information) y no tienen plural ni llevan <i>a / an</i>.`),
  H('Cantidades'),
  TBL(['Palabra', 'Contables', 'Incontables', 'Ejemplo'], [['some', 'sí (plural)', 'sí', 'I need some books / some milk. (frases afirmativas y ofrecimientos)'], ['any', 'sí (plural)', 'sí', 'Is there any milk? There aren\'t any chairs.'], ['no', 'sí', 'sí', 'There is no milk. (= There isn\'t any)'],
    ['much', 'no', 'sí', 'How much money? I don\'t have much time.'], ['many', 'sí', 'no', 'How many people? There aren\'t many buses.'], ['a lot of', 'sí', 'sí', 'There are a lot of pubs. I have a lot of work.'],
    ['a few / few', 'sí', 'no', 'A few friends (algunos). Few friends (casi ninguno).'], ['a little / little', 'no', 'sí', 'A little time (algo). Little time (casi nada).']]),
  H('Artículos'),
  UL([`<b>a / an:</b> cosa singular contable, no concreta o mencionada por primera vez. <i>a</i> ante sonido consonante (a book), <i>an</i> ante sonido vocal (an umbrella).`, `<b>the:</b> algo ya conocido, único o específico: <i>The bus to Cork is late.</i>`, `<b>sin artículo:</b> plurales e incontables en general (<i>I like music</i>), países y ciudades (<i>Ireland, Cork</i>), idiomas (<i>I speak Spanish</i>).`]),
  EX([[`Can I have <mark>some</mark> water, please?`, '¿Me das un poco de agua, por favor?'], [`<mark>How much</mark> is a Leap Card?`, '¿Cuánto cuesta una Leap Card?'], [`<mark>How many</mark> stops are there to the airport?`, '¿Cuántas paradas hay hasta el aeropuerto?'],
    [`There isn't <mark>any</mark> milk in the fridge.`, 'No hay leche en la nevera.'], [`I have <mark>a few</mark> friends in Dublin.`, 'Tengo algunos amigos en Dublín.']]),
  TIP('', `Estas palabras son <b>incontables</b> en inglés: <i>information, advice, news, luggage, furniture, money, weather, work, traffic, bread</i>. Para contarlas se usa <i>a piece of</i>: a piece of advice, a loaf of bread.`),
  H('Errores típicos'),
  ERR([['I need some informations.', 'I need some information.', '<i>Information</i> no tiene plural.'], ['She gave me an advice.', 'She gave me some advice. / a piece of advice.', '<i>Advice</i> es incontable.'], ['How many money?', 'How much money?', 'Incontable: much.'],
    ['The life is expensive.', 'Life is expensive.', 'Sin artículo cuando hablas en general.'], ['I have a luggage.', 'I have some luggage. / a bag.', '<i>Luggage</i> es incontable.']])
], [
  mc('Can I have ___ water, please?', ['some', 'a', 'many', 'few'], 0, 'Ofrecimiento o petición con incontable: some.'),
  mc('There isn\'t ___ milk in the fridge.', ['any', 'some', 'many', 'a'], 0, 'Negativo con incontable: any.'),
  mc('How ___ money do you need?', ['much', 'many', 'few', 'a lot'], 0, 'Money es incontable: much.'),
  mc('She gave me some good ___.', ['advice', 'advices', 'an advice', 'advises'], 0, 'Advice es incontable.'),
  fill('I have ___ umbrella. (a / an)', ['an'], 'Umbrella empieza con sonido vocálico.'),
  mc('We visited ___ Ireland last summer.', ['(no article)', 'the', 'a', 'an'], 0, 'Los países no llevan the (salvo the UK o the USA).'),
  fill('I speak ___ English, but I\'m learning. (un poco)', ['a little'], 'A little = un poco, tono positivo.')
]));

UNITS.push(U(9, 'A2', 'Comparatives and superlatives', 'Comparar y destacar', [
  Pp(`El <b>comparativo</b> compara dos cosas (bigger than). El <b>superlativo</b> destaca una entre varias (the biggest).`),
  TBL(['Tipo de adjetivo', 'Comparativo', 'Superlativo'], [['Corto (1 sílaba)', 'cheap → cheaper than', 'the cheapest'], ['Termina en -e', 'nice → nicer', 'the nicest'], ['Consonante-vocal-consonante', 'big → bigger', 'the biggest'], ['Termina en consonante + y', 'easy → easier', 'the easiest'],
    ['Largo (2 o más sílabas)', 'expensive → more expensive than', 'the most expensive'], ['Irregulares', 'good → better · bad → worse · far → farther / further', 'the best · the worst · the farthest']]),
  H('Otras comparaciones'),
  UL([`<b>as … as:</b> igual de. <i>Cork is as friendly as Dublin.</i>`, `<b>not as … as:</b> no tan. <i>Cork isn’t as big as Dublin.</i>`, `<b>less / the least:</b> menos. <i>It’s less expensive.</i>`, `<b>the more…, the more…:</b> <i>The more you practise, the better you speak.</i>`, `<b>too / enough:</b> <i>It’s too cold.</i> / <i>It’s warm enough.</i>`]),
  EX([[`Dublin is <mark>bigger than</mark> Cork.`, 'Dublín es más grande que Cork.'], [`Living in Dublin is <mark>more expensive than</mark> living in Cork.`, 'Vivir en Dublín es más caro que vivir en Cork.'], [`This is <mark>the best</mark> coffee in town.`, 'Este es el mejor café de la ciudad.'],
    [`It isn't <mark>as warm as</mark> Mexico City in winter.`, 'No es tan cálido como Ciudad de México en invierno.'], [`It's <mark>the wettest</mark> month of the year.`, 'Es el mes más lluvioso del año.']]),
  TIP('', `En Irlanda se dice mucho <b>It’s grand</b> (está bien) y <b>It’s lashing</b> (llueve a mares). Para hablar del clima, los comparativos salen constantemente: “It’s colder than yesterday.”`, true),
  H('Errores típicos'),
  ERR([['more bigger', 'bigger', 'No se combinan more y -er.'], ['the most cheap', 'the cheapest', 'Adjetivo corto: -est.'], ['Cork is smaller that Dublin.', 'Cork is smaller than Dublin.', 'Se usa <i>than</i>, no <i>that</i>.'], ['as tall than', 'as tall as', 'as … as.']])
], [
  mc('Cork is ___ than Dublin.', ['smaller', 'more small', 'smallest', 'small'], 0, 'Adjetivo corto + -er + than.'),
  fill('This bus is ___ (fast) than the train.', ['faster'], 'Corto: -er.'),
  mc('This is the ___ pub in town. (good)', ['best', 'better', 'most good', 'goodest'], 0, 'Superlativo irregular: the best.'),
  fill('Dublin is ___ (expensive) than Cork.', ['more expensive'], 'Adjetivo largo: more + adjetivo.'),
  mc('He isn\'t ___ tall as his brother.', ['as', 'than', 'so than', 'more'], 0, 'not as … as.'),
  fill('It\'s the ___ (cold) day of the year.', ['coldest'], 'Superlativo corto: the + -est.'),
  ord('Spain is much warmer than Ireland', 'Comparativo corto + than.')
]));
